<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox MacPlayer Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
        }

        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 100%;
        }

        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid #404040;
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .status {
            font-size: 14px;
            color: #888;
            margin-top: 20px;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: #51cf66;
        }

        .info {
            font-size: 12px;
            color: #666;
            margin-top: 40px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .message {
                font-size: 20px;
            }

            .spinner {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="message" id="message">Fetching latest Roblox MacPlayer version...</div>
        <div class="status" id="status">This may take a moment...</div>
        <div class="info">
            Roblox MacPlayer Downloader for PlayCover
        </div>
    </div>

    <script>
        async function downloadRobloxMacPlayer() {
            const messageEl = document.getElementById('message');
            const statusEl = document.getElementById('status');

            try {
                statusEl.textContent = 'Connecting to Roblox API...';

                // Fetch version from Roblox API
                const response = await fetch(
                    'https://clientsettings.roblox.com/v2/client-version/MacPlayer/channel/LIVE',
                    {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`API returned ${response.status}`);
                }

                const data = await response.json();
                const version = data.clientVersionUpload;

                if (!version) {
                    throw new Error('No clientVersionUpload in response');
                }

                statusEl.textContent = `Version: ${version}`;
                messageEl.textContent = 'Preparing download...';

                // Construct download URL
                const downloadUrl = `https://setup.rbxcdn.com/mac/${version}-RobloxPlayer.zip`;

                statusEl.innerHTML = '<span class="success">✓ Download starting...</span>';

                // Wait a moment before redirecting
                await new Promise(resolve => setTimeout(resolve, 1000));

                // Redirect to ZIP
                window.location.replace(downloadUrl);

            } catch (error) {
                messageEl.textContent = 'Failed to fetch latest Roblox version.';
                statusEl.innerHTML = `<span class="error">✗ Error: ${error.message}</span>`;
                console.error('Download error:', error);

                // Offer retry
                const retryBtn = document.createElement('button');
                retryBtn.textContent = 'Retry';
                retryBtn.style.cssText = `
                    margin-top: 20px;
                    padding: 10px 30px;
                    background: #00d9ff;
                    color: #1a1a1a;
                    border: none;
                    border-radius: 4px;
                    font-size: 14px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.3s ease;
                `;
                retryBtn.onmouseover = () => retryBtn.style.background = '#00b8d4';
                retryBtn.onmouseout = () => retryBtn.style.background = '#00d9ff';
                retryBtn.onclick = () => location.reload();

                statusEl.appendChild(document.createElement('br'));
                statusEl.appendChild(retryBtn);
            }
        }

        // Start download on page load
        downloadRobloxMacPlayer();
    </script>
</body>
</html>
